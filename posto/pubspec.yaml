name: posto
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cloud_firestore: ^5.6.5
  cloud_functions: ^5.4.0
  firebase_core: ^3.12.1
  firebase_database: ^11.3.4
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.9

  device_preview: ^1.3.1
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_quill: ^11.0.0
  flutter_quill_extensions: ^11.0.0
  table_calendar: ^3.1.3

  intl: ^0.20.2
  package_info_plus: ^8.3.0
  uuid: ^4.4.0
  flutter_webrtc: ^0.12.1+hotfix.1
  archive: ^4.0.4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  freezed_annotation: ^3.1.0

  pointycastle: ^4.0.0
  basic_utils: ^5.8.2
  fast_rsa: ^3.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  riverpod_lint: ^2.6.5
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  freezed: ^3.1.0

flutter:
  assets:
    - assets/

    - packages/fast_rsa/web/assets/worker.js
    - packages/fast_rsa/web/assets/wasm_exec.js
    - packages/fast_rsa/web/assets/rsa.wasm

  generate: true
  uses-material-design: true
